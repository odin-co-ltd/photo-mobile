const $=id=>document.getElementById(id);let pref={lang:'ko',theme:'light'};try{const x=JSON.parse(localStorage.getItem('odin-photo-prefs')||'{}');pref.lang=texts[x.lang]?x.lang:'ko';pref.theme=x.theme==='dark'?'dark':'light'}catch{}
let user=null,rooms=[],roomId='',photos=[],token='',expiry=0,expiryTimer=0,busy=false,loginBusy=false,lastFocus=null,draftTimer=0,dbPromise=null;
const t=k=>texts[pref.lang][k];const room=()=>rooms.find(r=>r.id===roomId);const uid=()=>crypto.randomUUID();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,5500)}
function savePref(){try{localStorage.setItem('odin-photo-prefs',JSON.stringify(pref))}catch{}}
function render(){document.documentElement.lang=pref.lang;document.body.classList.toggle('dark',pref.theme==='dark');document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=t(el.dataset.t));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('identityName').textContent=user?.name||'';$('identityProject').textContent=room()?.name||t('selectRoom');$('identity').title=(user?.name||'')+' · '+(room()?.name||'');$('identity').ariaLabel=$('identity').title;$('count').textContent=t('count')(photos.length);$('sendLabel').textContent=t('sendLive')(photos.filter(p=>!p.sent).length);$('send').disabled=busy||!user||!room()||!photos.some(p=>!p.sent);$('drivePath').textContent=t('drive')+' / '+(room()?.name||'');$('telegramPath').textContent=t('telegram')+' / '+(room()?.name||'');document.querySelectorAll('.destrow .check').forEach(e=>e.textContent='✓');$('loginTitle').textContent=t('loginTitle');$('loginHint').textContent=t('loginHint');$('retryLogin').textContent=t('retryLogin');$('settings').ariaLabel=t('settings');$('close').ariaLabel=t('close');renderPhotos();}
function renderPhotos(){$('strip').replaceChildren();if(!photos.length){const e=document.createElement('div');e.className='empty';e.textContent=t('empty');$('strip').append(e)}photos.forEach((p,i)=>{const tile=document.createElement('div');tile.className='thumb';const img=document.createElement('img');img.src=p.url;img.alt=t('photos')+' '+(i+1)+(p.sent?' · '+t('sentLabel'):'');img.tabIndex=0;img.onclick=()=>{open(t('zoom'),'<img id="zoom" class="zoom" alt="">');$('zoom').src=p.url;$('zoom').alt=img.alt};img.onkeydown=e=>{if(e.key==='Enter')img.click()};const del=document.createElement('button');del.textContent=p.sent?'✓':'×';del.ariaLabel=img.alt+' ×';del.onclick=()=>{if(busy)return;URL.revokeObjectURL(p.url);photos.splice(i,1);render();scheduleDraft()};tile.append(img,del);$('strip').append(tile)})}
function open(title,html){if($('overlay').hidden)lastFocus=document.activeElement;$('dialogTitle').textContent=title;$('sheetBody').innerHTML=html;$('overlay').hidden=false;document.body.style.overflow='hidden';$('close').hidden=false;$('close').focus()}
function close(){$('overlay').hidden=true;document.body.style.overflow='';lastFocus?.focus()}
$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const a=[...$('overlay').querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled&&!x.hidden);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0]?.focus()}}});
function settings(){if(busy)return;open(t('settings'),`<label class="settinglabel">${t('theme')}</label><div class="themegroup"><button id="light" class="${pref.theme==='light'?'active':''}">☀ ${t('light')}</button><button id="dark" class="${pref.theme==='dark'?'active':''}">☾ ${t('dark')}</button></div><label class="settinglabel" for="lang">${t('language')}</label><select id="lang"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option><option value="vi">Tiếng Việt</option></select><button class="send done" id="done">${t('done')}</button><button class="projectoption" style="margin-top:16px" id="logout">${t('logout')}</button>`);$('lang').value=pref.lang;['light','dark'].forEach(mode=>$(mode).onclick=()=>{pref.theme=mode;savePref();render();settings()});$('lang').onchange=e=>{pref.lang=e.target.value;savePref();render();settings()};$('done').onclick=close;$('logout').onclick=async()=>{await saveDraft();signOut('')};}
$('settings').onclick=settings;
async function api(url,body){if(!token||Date.now()>=expiry){signOut(t('needLogin'));throw Error(t('needLogin'))}const abort=new AbortController(),timer=setTimeout(()=>abort.abort(),110000);try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body),credentials:'omit',cache:'no-store',signal:abort.signal});let d;try{d=await res.json()}catch{throw Error(t('unknown'))}if(res.status===401){signOut(t('needLogin'));throw Error(t('needLogin'))}if(!res.ok||d.ok!==true)throw Error(d.error||t('notConnected'));return d}finally{clearTimeout(timer)}}
async function roomSettings(){if(busy)return;if(photos.some(p=>p.attemptRoom)){toast(t('pendingRoom'));return}try{const config=await api(CONFIG.configUrl,{});rooms=config.rooms;user=config.user;render();open(t('selectRoom'),`<label class="settinglabel" for="roomSelect">${t('chooseRoom')}</label><select id="roomSelect">${rooms.map(r=>`<option value="${esc(r.id)}">${esc(r.name)}</option>`).join('')}</select><button class="send done" id="roomDone">${t('doneRoom')}</button>`);$('overlay').classList.add('identity-mode');$('roomSelect').value=roomId||rooms[0]?.id||'';$('roomDone').onclick=()=>{roomId=$('roomSelect').value;try{localStorage.setItem('odin-photo-room:'+user.id,roomId)}catch{}render();scheduleDraft();close()}}catch(e){toast(e.message)}}
$('identity').onclick=roomSettings;
function signOut(message){clearTimeout(expiryTimer);token='';expiry=0;document.querySelector('main').inert=true;$('loginGate').hidden=false;$('loginStatus').textContent=message;close();if(window.google?.accounts?.id)google.accounts.id.disableAutoSelect();}
async function googleLogin(response){if(loginBusy||busy)return;loginBusy=true;$('loginStatus').textContent=t('checking');try{token=String(response.credential||'');const p=token.split('.');if(p.length!==3)throw Error(t('needLogin'));const payload=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(p[1].replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))));expiry=Number(payload.exp)*1000;if(!Number.isFinite(expiry)||expiry<=Date.now())throw Error(t('needLogin'));const d=await api(CONFIG.configUrl,{});if(!d.user?.id||!d.user.name||!Array.isArray(d.rooms)||!d.rooms.length)throw Error(t('notConnected'));photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];user=d.user;rooms=d.rooms;try{roomId=localStorage.getItem('odin-photo-room:'+user.id)||''}catch{roomId=''}await restoreDraft();if(!room())roomId='';render();document.querySelector('main').inert=false;$('loginGate').hidden=true;clearTimeout(expiryTimer);expiryTimer=setTimeout(()=>signOut(t('needLogin')),Math.max(1,expiry-Date.now()));if(!roomId)await roomSettings();}catch(e){token='';expiry=0;$('loginStatus').textContent=e.message||t('notConnected')}finally{loginBusy=false}}
function initializeGoogle(){if(!window.google?.accounts?.id){$('loginStatus').textContent=t('notConnected');return}$('googleButton').innerHTML='';google.accounts.id.initialize({client_id:CONFIG.clientId,callback:googleLogin,auto_select:false});google.accounts.id.renderButton($('googleButton'),{type:'standard',theme:'outline',size:'large',text:'signin_with',locale:pref.lang,width:Math.min(400,window.innerWidth-80)});$('loginStatus').textContent='';}
$('retryLogin').onclick=()=>{if(window.google?.accounts?.id)return initializeGoogle();document.querySelector('script[data-google-login]')?.remove();loadGoogle()};function loadGoogle(){const tag=document.createElement('script');tag.src='https://accounts.google.com/gsi/client';tag.async=true;tag.dataset.googleLogin='true';tag.onload=initializeGoogle;tag.onerror=()=>$('loginStatus').textContent=t('notConnected');document.head.append(tag)}
function db(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('odin-photo-drafts-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('drafts');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return dbPromise}
function scheduleDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,250)}
async function saveDraft(){if(!user)return;const owner=user.id,draft={roomId,memo:$('memo').value,photos:photos.map(({url,...rest})=>rest)};try{const d=await db();await new Promise((resolve,reject)=>{const tx=d.transaction('drafts','readwrite');tx.objectStore('drafts').put(draft,owner);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch{toast(t('localFail'))}}
async function restoreDraft(){try{const d=await db(),draft=await new Promise((resolve,reject)=>{const r=d.transaction('drafts').objectStore('drafts').get(user.id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});if(!draft){$('memo').value='';return}roomId=draft.roomId||roomId;$('memo').value=draft.memo||'';photos=(draft.photos||[]).filter(p=>p.mimeType==='image/jpeg'&&typeof p.base64==='string').map(p=>({...p,url:URL.createObjectURL(base64Blob(p.base64))}));}catch{toast(t('localFail'))}}
function base64Blob(s){const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new Blob([bytes],{type:'image/jpeg'})}
async function convert(file){if(!file.type.startsWith('image/'))throw Error(t('photoError'));const src=URL.createObjectURL(file),img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error(t('photoError')));img.src=src});const scale=Math.min(1,1920/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',0.85).split(',')[1];if(data.length>4100000)data=canvas.toDataURL('image/jpeg',0.6).split(',')[1];if(data.length>4100000)throw Error(t('tooLarge'));return {id:uid(),requestId:uid(),mimeType:'image/jpeg',base64:data,sent:false,url:URL.createObjectURL(base64Blob(data))};}finally{URL.revokeObjectURL(src)}}
$('capture').onclick=()=>{if(!busy)$('cameraInput').click()};$('album').onclick=()=>{if(!busy)$('albumInput').click()};async function addFiles(e){if(busy)return;busy=true;try{for(const f of [...e.target.files])photos.push(await convert(f));render();await saveDraft()}catch(err){toast(err.message)}finally{e.target.value='';busy=false;render()}}$('cameraInput').onchange=addFiles;$('albumInput').onchange=addFiles;$('memo').oninput=scheduleDraft;
$('send').onclick=async()=>{if(busy||!user||!room()||!photos.length)return;busy=true;document.querySelector('main').classList.add('transferring');$('memo').disabled=true;$('send').disabled=true;const selected=roomId,memo=$('memo').value;try{await saveDraft();for(let i=0;i<photos.length;i++){const p=photos[i];if(p.sent)continue;if(p.attemptRoom&&p.attemptRoom!==selected)throw Error(t('pendingRoom'));p.attemptRoom=selected;await saveDraft();$('sendLabel').textContent=t('sending')((i+1)+' / '+photos.length);const d=await api(CONFIG.sendUrl,{roomId:selected,requestId:p.requestId,photoId:p.id,mimeType:p.mimeType,imageBase64:p.base64,memo});if(d.saved!==true||d.sent!==true)throw Error(t('unknown'));p.sent=true;await saveDraft();renderPhotos()}photos.forEach(p=>URL.revokeObjectURL(p.url));photos=[];$('memo').value='';await saveDraft();toast(t('complete'))}catch(e){toast(e.name==='AbortError'?t('unknown'):e.message||t('unknown'))}finally{busy=false;document.querySelector('main').classList.remove('transferring');$('memo').disabled=false;render()}};
window.addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue=''}});render();document.querySelector('main').inert=true;loadGoogle();

</script></body></html>
