const identityTexts={ko:{identityTitle:'작업자 · 프로젝트 변경',firstSetup:'처음 한 번만 설정해주세요',firstHint:'작업자 이름과 프로젝트를 선택하면 다음 접속부터 자동으로 적용됩니다.',identityHint:'변경한 프로젝트에 맞춰 전송 위치도 함께 바뀝니다.',startWork:'설정하고 시작하기',nameRequired:'작업자 이름을 입력해주세요.'},en:{identityTitle:'Worker · Project',firstSetup:'One-time setup',firstHint:'Enter your name and select a project. We will remember them on this browser.',identityHint:'Changing the project also changes both transfer destinations.',startWork:'Save and start',nameRequired:'Please enter your name.'},zh:{identityTitle:'修改工作人员 · 项目',firstSetup:'首次使用设置',firstHint:'请输入姓名并选择项目。下次打开此浏览器时将自动应用。',identityHint:'更改项目后，发送位置也会同步更新。',startWork:'保存并开始',nameRequired:'请输入姓名。'},vi:{identityTitle:'Nhân viên · Dự án',firstSetup:'Thiết lập lần đầu',firstHint:'Nhập tên và chọn dự án. Lần sau trình duyệt này sẽ tự áp dụng.',identityHint:'Đổi dự án sẽ cập nhật cả hai nơi nhận.',startWork:'Lưu và bắt đầu',nameRequired:'Vui lòng nhập tên.'}};Object.keys(identityTexts).forEach(lang=>Object.assign(texts[lang],identityTexts[lang]));
const $=id=>document.getElementById(id);let pref={lang:'ko',theme:'light',name:'',project:null,identityReady:false};try{pref={...pref,...JSON.parse(localStorage.getItem('odin-photo-prefs')||'{}')}}catch{}if(!texts[pref.lang])pref.lang='ko';pref.identityReady=Boolean(pref.identityReady&&pref.name.trim()&&Number.isInteger(pref.project)&&pref.project>=0&&pref.project<4);let project=pref.identityReady?pref.project:0,photos=[],lastFocus=null;const t=k=>texts[pref.lang][k];function save(){try{localStorage.setItem('odin-photo-prefs',JSON.stringify(pref))}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){document.documentElement.lang=pref.lang;document.body.classList.toggle('dark',pref.theme==='dark');document.querySelectorAll('[data-t]').forEach(el=>el.innerHTML=t(el.dataset.t));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));$('identityName').textContent=pref.name||t('unset');$('identityProject').textContent=pref.identityReady?t('projects')[project]:t('selectProject');$('identity').title=`${pref.name||t('unset')} · ${t('projects')[project]}`;$('identity').ariaLabel=`${t('identityTitle')}: ${$('identity').title}`;$('count').textContent=t('count')(photos.length);$('sendLabel').textContent=t('send')(photos.length);$('send').disabled=!photos.length;$('drivePath').textContent=`${t('drive')} / ODIN / ${t('projects')[project]}`;$('telegramPath').textContent=`${t('telegram')} / ODIN · ${t('projects')[project]}`;$('settings').ariaLabel=t('settings');$('close').ariaLabel=t('close');renderPhotos()}function renderPhotos(){$('strip').replaceChildren();if(!photos.length){const empty=document.createElement('div');empty.className='empty';empty.textContent=t('empty');$('strip').append(empty)}photos.forEach((p,i)=>{const tile=document.createElement('div');tile.className='thumb';const img=document.createElement('img');img.src=p.url;img.alt=`${t('photos')} ${i+1}`;img.tabIndex=0;img.onclick=()=>openZoom(p);img.onkeydown=e=>{if(e.key==='Enter')openZoom(p)};const del=document.createElement('button');del.textContent='×';del.ariaLabel=`${t('photos')} ${i+1} ×`;del.onclick=()=>{URL.revokeObjectURL(p.url);photos.splice(i,1);render()};tile.append(img,del);$('strip').append(tile)})}function open(title,html){if($('overlay').hidden)lastFocus=document.activeElement;$('overlay').classList.remove('identity-mode');$('close').hidden=false;$('dialogTitle').textContent=title;$('sheetBody').innerHTML=html;$('overlay').hidden=false;document.body.style.overflow='hidden';$('close').focus()}function close(){if(!pref.identityReady)return;$('overlay').classList.remove('identity-mode');$('overlay').hidden=true;document.body.style.overflow='';lastFocus?.focus()}$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape')close();if(e.key==='Tab'){const list=[...$('overlay').querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(x=>!x.disabled);const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});function settings(){open(t('settings'),`<label class="settinglabel">${t('theme')}</label><div class="themegroup"><button id="light" class="${pref.theme==='light'?'active':''}">☀ ${t('light')}</button><button id="dark" class="${pref.theme==='dark'?'active':''}">☾ ${t('dark')}</button></div><label class="settinglabel" for="lang">${t('language')}</label><select id="lang"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option><option value="vi">Tiếng Việt</option></select><button class="send done" id="done">${t('done')}</button>`);$('lang').value=pref.lang;['light','dark'].forEach(mode=>$(mode).onclick=()=>{pref.theme=mode;save();render();settings()});$('lang').onchange=e=>{pref.lang=e.target.value;save();render();settings()};$('done').onclick=close}
function identitySettings(){const first=!pref.identityReady;open(t(first?'firstSetup':'identityTitle'),`<p class="notice">${t(first?'firstHint':'identityHint')}</p><form id="identityForm"><label class="settinglabel" for="workerName">${t('name')}</label><input id="workerName" name="workerName" type="text" required maxlength="40" autocomplete="name" value="${esc(pref.name)}"><label class="settinglabel" for="projectSelect">${t('selectProject')}</label><select id="projectSelect" name="project" required><option value="" disabled>${t('selectProject')}</option>${t('projects').map((p,i)=>`<option value="${i}">${p}</option>`).join('')}</select><button type="submit" class="send done">${t(first?'startWork':'done')}</button></form>`);$('overlay').classList.add('identity-mode');$('close').hidden=first;$('projectSelect').value=first?'':String(project);$('identityForm').onsubmit=e=>{e.preventDefault();const name=$('workerName').value.trim();$('workerName').setCustomValidity(name?'':t('nameRequired'));if(!$('identityForm').reportValidity())return;pref.name=name;project=Number($('projectSelect').value);pref.project=project;pref.identityReady=true;save();render();close()};$('workerName').oninput=()=>$('workerName').setCustomValidity('');if(!first)$('workerName').focus()}
$('settings').onclick=settings;$('identity').onclick=identitySettings;
$('capture').onclick=()=>$('cameraInput').click();$('album').onclick=()=>$('albumInput').click();function addFiles(e){let invalid=false;for(const f of e.target.files){if(!f.type.startsWith('image/')){invalid=true;continue}photos.push({url:URL.createObjectURL(f)})}e.target.value='';render();if(invalid)toast(t('invalid'))} $('cameraInput').onchange=addFiles;$('albumInput').onchange=addFiles;function toast(s){$('toast').textContent=s;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,2800)}$('sample').onclick=()=>{const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480"><rect width="600" height="480" fill="#e3e9e3"/><path d="M0 350 600 285v195H0" fill="#c5d3ca"/><ellipse cx="305" cy="380" rx="150" ry="22" fill="#476b5520"/><g stroke="#7c573b" stroke-width="19" stroke-linecap="round" fill="none"><path d="m209 214-17-105m198 105 17-105M217 266l-24 112m187-112 24 112M195 126h209M201 162h196M208 199h182"/></g><path d="M205 223h190l15 49H190z" fill="#926847"/><path d="M214 222h172l7 30H205z" fill="#304a40"/><text x="32" y="42" fill="#42594c" font-family="Arial,sans-serif" font-size="18">ODIN / ${esc(t('sampleText'))}</text><text x="32" y="448" fill="#42594c" font-family="Arial,sans-serif" font-size="14">${esc(t('projects')[project])} · ${new Date().toLocaleDateString(pref.lang)}</text></svg>`;photos.push({url:URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}))});render();toast(t('sampleAdded'))};function openZoom(p){open(t('zoom'),'<img class="zoom" id="zoom" alt="">');$('zoom').src=p.url;$('zoom').alt=t('zoom')}$('send').onclick=()=>{if(!photos.length)return;const target=t('projects')[project];open(t('demoTitle'),`<p class="notice">${esc(t('demoNote'))}</p><p><strong>${esc(target)} · ${t('count')(photos.length)}</strong></p><div class="statusrow"><svg><use href="#folder"/></svg><div>Google Drive<small id="driveStatus">${t('saving')}</small></div></div><div class="statusrow"><svg><use href="#send"/></svg><div>Telegram<small id="telegramStatus">${t('sending')}</small></div></div><button class="send done" id="finish">${t('done')}</button>`);$('finish').onclick=close;setTimeout(()=>{if($('driveStatus'))$('driveStatus').textContent=t('simulated')},800);setTimeout(()=>{if($('telegramStatus'))$('telegramStatus').textContent=t('simulated')},1400)};render();if(!pref.identityReady)identitySettings();
</script></body></html>
